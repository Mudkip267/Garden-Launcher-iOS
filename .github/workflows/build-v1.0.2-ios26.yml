name: Build Garden Launcher v1.0.2 Mobile UX + Rumble (iOS 26+ Apple Xcode)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4

      - name: Download Verified Base Garden-Launcher-1.0.2-iOS26-27.ipa
        run: |
          mkdir -p work/stage
          curl -fsSL -o work/base-v1.0.2.ipa "https://github.com/hanprm9-dot/Garden-Launcher-iOS/releases/download/v1.0.2/Garden-Launcher-1.0.2-iOS26-27.ipa"
          ACTUAL_SHA=$(shasum -a 256 work/base-v1.0.2.ipa | awk '{print tolower($1)}')
          EXPECTED_SHA="cb6c13fc95496b6dbcce4fe45b631c9abc042771ac278aa05d42c0b7a71f02a0"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "SHA-256 mismatch: $ACTUAL_SHA != $EXPECTED_SHA"
            exit 1
          fi
          unzip -q work/base-v1.0.2.ipa -d work/stage
          ls -la work/stage/Payload/SDViOS.app

      - name: Compile Updated SDVModGarden.framework (arm64 iOS + CoreHaptics Controller Rumble)
        run: |
          set -euo pipefail
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos --find clang)
          echo "Using SDK: $IOS_SDK"
          mkdir -p work/native

          "$CLANG" -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=16.0 \
            -O2 -fvisibility=hidden -c ModGarden/vendor/miniz.c -o work/native/miniz.o

          "$CLANG" -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=16.0 \
            -O2 -fobjc-arc -fvisibility=hidden -IModGarden \
            -Wno-deprecated-declarations \
            -c ModGarden/Embedded.m -o work/native/Embedded.o

          "$CLANG" -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=16.0 \
            -dynamiclib -install_name @rpath/SDVModGarden.framework/SDVModGarden \
            -Wl,-fixup_chains \
            work/native/Embedded.o work/native/miniz.o \
            -framework Foundation \
            -framework CoreFoundation \
            -framework CoreGraphics \
            -framework UIKit \
            -framework QuartzCore \
            -framework AVFoundation \
            -framework AVFAudio \
            -framework PhotosUI \
            -framework GameController \
            -framework UniformTypeIdentifiers \
            -weak_framework CoreHaptics \
            -o work/native/SDVModGarden

          echo "=== Exported symbols of rebuilt SDVModGarden ==="
          nm -gU work/native/SDVModGarden | grep -E "_sdv_"
          for sym in _sdv_ext_set_rumble _sdv_ext_poll_input _sdv_ext_set_mouse_norm _sdv_ext_get_direct_touch_count _sdv_boot_report _sdv_boot_on_log _sdv_kb_show _sdv_kb_poll _sdv_kb_is_active; do
            if ! nm -gU work/native/SDVModGarden | grep -q "$sym"; then
              echo "MISSING EXPORTED SYMBOL: $sym"
              exit 1
            fi
          done
          echo "=== Linked frameworks ==="
          otool -L work/native/SDVModGarden

          APP="work/stage/Payload/SDViOS.app"
          cp -f work/native/SDVModGarden "$APP/Frameworks/SDVModGarden.framework/SDVModGarden"

      - name: Inject Audited SDVMobileControls.dll & Verify v1.0.2 Audio Fix
        run: |
          APP="work/stage/Payload/SDViOS.app"
          DST="$APP/Frameworks/SDVModGarden.framework/BundledMods/SDVMobileControls"
          mkdir -p "$DST"
          cp -f "ModGarden/SDVMobileControls/prebuilt/SDVMobileControls.dll" "$DST/SDVMobileControls.dll"
          cp -f "ModGarden/SDVMobileControls/manifest.json" "$DST/manifest.json"
          shasum -a 256 "$DST/SDVMobileControls.dll"

      - name: Patch MonoGame CueDefinition (UI Info Suite 2 Compat) & Verify SoundBank Audio IL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appDir = (Resolve-Path "work/stage/Payload/SDViOS.app").Path
          $mgDll = Join-Path $appDir "MonoGame.Framework.dll"
          $cecilDll = Join-Path $appDir "Mono.Cecil.dll"
          Add-Type -Path $cecilDll

          $resolver = New-Object Mono.Cecil.DefaultAssemblyResolver
          $resolver.AddSearchDirectory($appDir)
          $resolver.AddSearchDirectory([System.IO.Path]::GetDirectoryName([object].Assembly.Location))
          $rp = New-Object Mono.Cecil.ReaderParameters
          $rp.AssemblyResolver = $resolver
          $rp.ReadWrite = $false

          $tmpOut = "$mgDll.patched.tmp"
          $asm = [Mono.Cecil.AssemblyDefinition]::ReadAssembly($mgDll, $rp)
          try {
              $mod = $asm.MainModule
              $sb = $mod.GetType("Microsoft.Xna.Framework.Audio.SoundBank")
              $ex = $sb.Methods | Where-Object { $_.Name -eq "Exists" -and $_.Parameters.Count -eq 1 } | Select-Object -First 1
              if ($ex.Body.Instructions.Count -lt 10) {
                  throw "MonoGame SoundBank.Exists is broken (ops=$($ex.Body.Instructions.Count))"
              }

              # Add missing PC Stardew CueDefinition members required by UI Info Suite 2 (SoundHelper.RegisterSound)
              $cd = $mod.GetType("Microsoft.Xna.Framework.Audio.CueDefinition")
              if (-not $cd) { throw "CueDefinition not found" }

              $tInt32 = $mod.TypeSystem.Int32
              $tBool = $mod.TypeSystem.Boolean
              $tVoid = $mod.TypeSystem.Void
              $tString = $mod.TypeSystem.String
              $tEnum = ($mod.Types | Where-Object { $_.IsEnum } | Select-Object -First 1).BaseType
              $tSoundEffect = $mod.GetType("Microsoft.Xna.Framework.Audio.SoundEffect")
              $tSoundEffectArr = New-Object Mono.Cecil.ArrayType($tSoundEffect)

              $lb = $cd.NestedTypes | Where-Object { $_.Name -eq "LimitBehavior" } | Select-Object -First 1
              if (-not $lb) {
                  $enumAttrs = [Mono.Cecil.TypeAttributes]([int][Mono.Cecil.TypeAttributes]::NestedPublic -bor [int][Mono.Cecil.TypeAttributes]::Sealed)
                  $lb = New-Object Mono.Cecil.TypeDefinition("", "LimitBehavior", $enumAttrs, $tEnum)
                  $valAttrs = [Mono.Cecil.FieldAttributes]([int][Mono.Cecil.FieldAttributes]::Public -bor [int][Mono.Cecil.FieldAttributes]::SpecialName -bor [int][Mono.Cecil.FieldAttributes]::RTSpecialName)
                  $lb.Fields.Add((New-Object Mono.Cecil.FieldDefinition("value__", $valAttrs, $tInt32)))
                  $constAttrs = [Mono.Cecil.FieldAttributes]([int][Mono.Cecil.FieldAttributes]::Public -bor [int][Mono.Cecil.FieldAttributes]::Static -bor [int][Mono.Cecil.FieldAttributes]::Literal -bor [int][Mono.Cecil.FieldAttributes]::HasDefault)
                  foreach ($kv in @(
                      @("FailToPlay", 0),
                      @("Queue", 1),
                      @("ReplaceOldest", 2),
                      @("ReplaceLowestPriority", 3),
                      @("ReplaceQuiet", 4)
                  )) {
                      $ef = New-Object Mono.Cecil.FieldDefinition($kv[0], $constAttrs, $lb)
                      $ef.Constant = [int]$kv[1]
                      $lb.Fields.Add($ef)
                  }
                  $cd.NestedTypes.Add($lb)
              }

              if (-not ($cd.Fields | Where-Object { $_.Name -eq "instanceLimit" })) {
                  $cd.Fields.Add((New-Object Mono.Cecil.FieldDefinition("instanceLimit", [Mono.Cecil.FieldAttributes]::Public, $tInt32)))
              }
              if (-not ($cd.Fields | Where-Object { $_.Name -eq "limitBehavior" })) {
                  $cd.Fields.Add((New-Object Mono.Cecil.FieldDefinition("limitBehavior", [Mono.Cecil.FieldAttributes]::Public, $lb)))
              }

              $optParam = [Mono.Cecil.ParameterAttributes]([int][Mono.Cecil.ParameterAttributes]::Optional -bor [int][Mono.Cecil.ParameterAttributes]::HasDefault)
              $arrSetSound = $cd.Methods | Where-Object {
                  $_.Name -eq "SetSound" -and $_.Parameters.Count -eq 4 -and $_.Parameters[0].ParameterType.FullName -eq "Microsoft.Xna.Framework.Audio.SoundEffect[]"
              } | Select-Object -First 1
              $singleSetSound = $cd.Methods | Where-Object {
                  $_.Name -eq "SetSound" -and $_.Parameters.Count -eq 4 -and $_.Parameters[0].ParameterType.FullName -eq "Microsoft.Xna.Framework.Audio.SoundEffect"
              } | Select-Object -First 1
              if (-not $singleSetSound) {
                  $mAttrs = [Mono.Cecil.MethodAttributes]([int][Mono.Cecil.MethodAttributes]::Public -bor [int][Mono.Cecil.MethodAttributes]::HideBySig)
                  $mSet = New-Object Mono.Cecil.MethodDefinition("SetSound", $mAttrs, $tVoid)
                  $mSet.Parameters.Add((New-Object Mono.Cecil.ParameterDefinition("sound_effect", [Mono.Cecil.ParameterAttributes]::None, $tSoundEffect)))
                  $mSet.Parameters.Add((New-Object Mono.Cecil.ParameterDefinition("category_id", [Mono.Cecil.ParameterAttributes]::None, $tInt32)))
                  $pLoop = New-Object Mono.Cecil.ParameterDefinition("loop", $optParam, $tBool); $pLoop.Constant = $false; $mSet.Parameters.Add($pLoop)
                  $pRev = New-Object Mono.Cecil.ParameterDefinition("use_reverb", $optParam, $tBool); $pRev.Constant = $false; $mSet.Parameters.Add($pRev)
                  $il = $mSet.Body.GetILProcessor()
                  if ($arrSetSound) {
                      # Forward to CueDefinition.SetSound(new SoundEffect[] { sound_effect }, category_id, loop, use_reverb) so mod sounds actually play!
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_0))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Ldc_I4_1))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Newarr, $tSoundEffect))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Dup))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Ldc_I4_0))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_1))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Stelem_Ref))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_2))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_3))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_S, $pRev))
                      $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Call, [Mono.Cecil.MethodReference]$arrSetSound))
                  }
                  $il.Append($il.Create([Mono.Cecil.Cil.OpCodes]::Ret))
                  $cd.Methods.Add($mSet)
                  $singleSetSound = $mSet
              }

              $defCtor = $cd.Methods | Where-Object { $_.Name -eq ".ctor" -and $_.Parameters.Count -eq 0 } | Select-Object -First 1
              $objCtor = ($defCtor.Body.Instructions | Where-Object { $_.OpCode -eq [Mono.Cecil.Cil.OpCodes]::Call } | Select-Object -First 1).Operand
              $fName = $cd.Fields | Where-Object { $_.Name -eq "name" } | Select-Object -First 1
              foreach ($sndType in @($tSoundEffect, $tSoundEffectArr)) {
                  $exists = $cd.Methods | Where-Object {
                      $_.Name -eq ".ctor" -and $_.Parameters.Count -eq 5 -and $_.Parameters[1].ParameterType.FullName -eq $sndType.FullName
                  }
                  if (-not $exists) {
                      $cAttrs = [Mono.Cecil.MethodAttributes]([int][Mono.Cecil.MethodAttributes]::Public -bor [int][Mono.Cecil.MethodAttributes]::HideBySig -bor [int][Mono.Cecil.MethodAttributes]::SpecialName -bor [int][Mono.Cecil.MethodAttributes]::RTSpecialName)
                      $ctor = New-Object Mono.Cecil.MethodDefinition(".ctor", $cAttrs, $tVoid)
                      $ctor.Parameters.Add((New-Object Mono.Cecil.ParameterDefinition("new_name", [Mono.Cecil.ParameterAttributes]::None, $tString)))
                      $ctor.Parameters.Add((New-Object Mono.Cecil.ParameterDefinition("sound_effect", [Mono.Cecil.ParameterAttributes]::None, $sndType)))
                      $ctor.Parameters.Add((New-Object Mono.Cecil.ParameterDefinition("category_id", [Mono.Cecil.ParameterAttributes]::None, $tInt32)))
                      $pL = New-Object Mono.Cecil.ParameterDefinition("loop", $optParam, $tBool); $pL.Constant = $false; $ctor.Parameters.Add($pL)
                      $pR = New-Object Mono.Cecil.ParameterDefinition("use_reverb", $optParam, $tBool); $pR.Constant = $false; $ctor.Parameters.Add($pR)
                      $cil = $ctor.Body.GetILProcessor()
                      $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_0))
                      $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Call, [Mono.Cecil.MethodReference]$objCtor))
                      $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_0))
                      $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_1))
                      $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Stfld, $fName))
                      $targetSet = if ($sndType -eq $tSoundEffect) { $singleSetSound } else { $arrSetSound }
                      if ($targetSet) {
                          $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_0))
                          $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_2))
                          $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_3))
                          $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_S, $pL))
                          $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ldarg_S, $pR))
                          $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Call, [Mono.Cecil.MethodReference]$targetSet))
                      }
                      $cil.Append($cil.Create([Mono.Cecil.Cil.OpCodes]::Ret))
                      $cd.Methods.Add($ctor)
                  }
              }

              $asm.Write($tmpOut)
          } finally {
              $asm.Dispose()
          }
          Move-Item -Force $tmpOut $mgDll

          # Strictly verify readback!
          $vAsm = [Mono.Cecil.AssemblyDefinition]::ReadAssembly($mgDll, $rp)
          try {
              $vsb = $vAsm.MainModule.GetType("Microsoft.Xna.Framework.Audio.SoundBank")
              $vex = $vsb.Methods | Where-Object { $_.Name -eq "Exists" -and $_.Parameters.Count -eq 1 } | Select-Object -First 1
              $vcd = $vAsm.MainModule.GetType("Microsoft.Xna.Framework.Audio.CueDefinition")
              $vlb = $vcd.NestedTypes | Where-Object { $_.Name -eq "LimitBehavior" }
              $vil = $vcd.Fields | Where-Object { $_.Name -eq "instanceLimit" }
              $vlbf = $vcd.Fields | Where-Object { $_.Name -eq "limitBehavior" }
              $vss = $vcd.Methods | Where-Object { $_.Name -eq "SetSound" -and $_.Parameters.Count -eq 4 -and $_.Parameters[0].ParameterType.FullName -eq "Microsoft.Xna.Framework.Audio.SoundEffect" }
              if (-not $vlb -or -not $vil -or -not $vlbf -or -not $vss -or $vex.Body.Instructions.Count -lt 10) {
                  throw "MonoGame readback verification failed!"
              }
              Write-Host "[AUDIO + UIIS2 COMPAT OK] SoundBank.Exists=$($vex.Body.Instructions.Count) ops, CueDefinition(LimitBehavior, instanceLimit, limitBehavior, SetSound) verified!"
          } finally {
              $vAsm.Dispose()
          }

          # Fix permanent AB-BA Exit-to-Title deadlock on iOS:
          # SDViOSTouchControls.ModEntry.PurgeNonCoreAssets & MemoryWatchdog.ForceCollect call GC.WaitForPendingFinalizers()
          # on the Main UI Thread right as RenderTarget2D.Finalize() calls Threading.BlockOnUIThread() on the Finalizer Thread!
          # Replacing WaitForPendingFinalizers() with Nop lets GC free memory cleanly while Threading.Run() drains GPU disposals.
          $tcDir = Join-Path $appDir "Mods/SDViOSTouchControls"
          $tcResolver = New-Object Mono.Cecil.DefaultAssemblyResolver
          $tcResolver.AddSearchDirectory($appDir)
          $tcResolver.AddSearchDirectory($tcDir)
          $tcResolver.AddSearchDirectory([System.IO.Path]::GetDirectoryName([object].Assembly.Location))
          $tcRp = New-Object Mono.Cecil.ReaderParameters
          $tcRp.AssemblyResolver = $tcResolver
          $tcRp.ReadWrite = $false

          $totalDeadlocksPatched = 0
          foreach ($dllName in @("SDViOSTouchControls.dll", "SDViOSTouchControlsMod.dll")) {
              $tcPath = Join-Path $tcDir $dllName
              if (-not (Test-Path $tcPath)) { continue }
              $tmpTc = "$tcPath.patched.tmp"
              $tAsm = [Mono.Cecil.AssemblyDefinition]::ReadAssembly($tcPath, $tcRp)
              $patched = 0
              try {
                  foreach ($t in $tAsm.MainModule.GetTypes()) {
                      foreach ($m in $t.Methods) {
                          if (-not $m.HasBody) { continue }
                          foreach ($ins in $m.Body.Instructions) {
                              if ($ins.Operand -ne $null -and $ins.Operand.ToString() -eq "System.Void System.GC::WaitForPendingFinalizers()") {
                                  $ins.OpCode = [Mono.Cecil.Cil.OpCodes]::Nop
                                  $ins.Operand = $null
                                  $patched++
                              }
                          }
                      }
                  }
                  if ($patched -gt 0) {
                      $tAsm.Write($tmpTc)
                  }
              } finally {
                  $tAsm.Dispose()
              }
              if ($patched -gt 0) {
                  Move-Item -Force $tmpTc $tcPath
                  $totalDeadlocksPatched += $patched
              }

              # Strict readback verification: 0 WaitForPendingFinalizers calls must remain!
              $vTc = [Mono.Cecil.AssemblyDefinition]::ReadAssembly($tcPath, $tcRp)
              try {
                  $rem = 0
                  foreach ($t in $vTc.MainModule.GetTypes()) {
                      foreach ($m in $t.Methods) {
                          if (-not $m.HasBody) { continue }
                          foreach ($ins in $m.Body.Instructions) {
                              if ($ins.Operand -ne $null -and $ins.Operand.ToString() -match "WaitForPendingFinalizers") { $rem++ }
                          }
                      }
                  }
                  if ($rem -ne 0) { throw "Deadlock patch readback failed on ${dllName}: $rem WaitForPendingFinalizers calls remain!" }
                  Write-Host "[EXIT-TO-TITLE DEADLOCK FIX OK] ${dllName}: patched $patched WaitForPendingFinalizers -> Nop (remaining=0)"
              } finally {
                  $vTc.Dispose()
              }
          }
          if ($totalDeadlocksPatched -lt 2) {
              throw "Expected at least 2 WaitForPendingFinalizers calls patched in SDViOSTouchControls, got $totalDeadlocksPatched"
          }

      - name: Sign & Strictly Verify Entire App Bundle with Apple codesign
        run: |
          APP="work/stage/Payload/SDViOS.app"
          rm -rf "$APP/_CodeSignature"
          rm -rf "$APP/Frameworks/SDVModGarden.framework/_CodeSignature"
          rm -rf "$APP/Frameworks/libSkiaSharp.framework/_CodeSignature"

          chmod 755 "$APP/SDViOS"
          chmod 755 "$APP/Frameworks/SDVModGarden.framework/SDVModGarden"
          chmod 755 "$APP/Frameworks/libSkiaSharp.framework/libSkiaSharp"

          codesign --force --sign - "$APP/Frameworks/libSkiaSharp.framework"
          codesign --force --sign - "$APP/Frameworks/SDVModGarden.framework"
          codesign --force --sign - "$APP"

          echo "=== Verifying signatures strictly with Apple codesign ==="
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package Clean IPA & Full Mach-O / Integrity Audit
        run: |
          cd work/stage
          zip -r -y -q ../../Garden-Launcher-1.0.2-iOS26-27-MobileUX.ipa Payload
          cd ../..
          python3 - << 'EOF'
          import zipfile, hashlib, pathlib, struct

          def validate_macho(data, label, is_dylib=False):
              magic, cputype, cpusub, filetype, ncmds, sizeofcmds, flags, _ = struct.unpack_from("<8I", data, 0)
              assert magic == 0xfeedfacf, f"{label}: not 64-bit Mach-O"
              assert filetype == (6 if is_dylib else 2), f"{label}: unexpected filetype {filetype}"
              pos = 32
              segs = []
              has_chained = False
              has_sig = False
              for _ in range(ncmds):
                  cmd, sz = struct.unpack_from("<II", data, pos)
                  if cmd == 0xe and is_dylib:
                      raise AssertionError(f"{label}: illegal LC_LOAD_DYLINKER in MH_DYLIB")
                  if cmd == 0x80000034:
                      has_chained = True
                  if cmd == 0x1d:
                      off, csz = struct.unpack_from("<2I", data, pos + 8)
                      assert off + csz == len(data), f"{label}: LC_CODE_SIGNATURE end mismatch"
                      has_sig = True
                  if cmd == 0x19:
                      seg = data[pos+8:pos+24].rstrip(b"\0").decode()
                      va, vs, fo, fs = struct.unpack_from("<4Q", data, pos + 24)
                      assert vs % 0x4000 == 0, f"{label}: segment {seg} vmsize not 16KB aligned"
                      if seg not in ("__PAGEZERO", "__LINKEDIT"):
                          assert fs % 0x4000 == 0, f"{label}: segment {seg} filesize not 16KB aligned"
                          assert fs <= vs, f"{label}: segment {seg} filesize > vmsize"
                          segs.append((seg, va, vs))
                      elif seg == "__LINKEDIT":
                          assert fo + fs == len(data), f"{label}: __LINKEDIT end mismatch"
                          segs.append((seg, va, vs))
                  pos += sz
              for a, b in zip(segs, segs[1:]):
                  assert a[1] + a[2] == b[1], f"{label}: VM gap between {a[0]} and {b[0]}"
              assert has_chained, f"{label}: missing LC_DYLD_CHAINED_FIXUPS"
              assert has_sig, f"{label}: missing LC_CODE_SIGNATURE"
              assert bytes.fromhex("fade0cc0") in data, f"{label}: missing SuperBlob signature"
              print(f"  [Mach-O OK] {label}: 16KB aligned + LC_DYLD_CHAINED_FIXUPS + Apple codesign ({len(data):,} bytes)")

          ipa = pathlib.Path("Garden-Launcher-1.0.2-iOS26-27-MobileUX.ipa")
          new_dll = pathlib.Path("ModGarden/SDVMobileControls/prebuilt/SDVMobileControls.dll").read_bytes()
          target_rel = "Payload/SDViOS.app/Frameworks/SDVModGarden.framework/BundledMods/SDVMobileControls/SDVMobileControls.dll"
          with zipfile.ZipFile(ipa, "r") as z:
              assert z.testzip() is None, "Corrupt ZIP!"
              for n in z.namelist():
                  low = n.lower()
                  assert "/bundledgame/" not in low and "/content/" not in low, f"Proprietary content found: {n}"
                  assert pathlib.Path(n).name.lower() not in {"stardew valley.dll", "xtile.dll", "bmfont.dll", "stardewvalley.gamedata.dll"}, f"Proprietary DLL found: {n}"
              assert hashlib.sha256(z.read(target_rel)).digest() == hashlib.sha256(new_dll).digest(), "SDVMobileControls.dll SHA-256 mismatch!"
              assert "Payload/SDViOS.app/_CodeSignature/CodeResources" in z.NameToInfo
              assert "Payload/SDViOS.app/Frameworks/SDVModGarden.framework/_CodeSignature/CodeResources" in z.NameToInfo
              validate_macho(z.read("Payload/SDViOS.app/SDViOS"), "SDViOS", is_dylib=False)
              mg_bin = z.read("Payload/SDViOS.app/Frameworks/SDVModGarden.framework/SDVModGarden")
              validate_macho(mg_bin, "SDVModGarden", is_dylib=True)
              assert b"_sdv_ext_set_rumble" in mg_bin, "SDVModGarden missing _sdv_ext_set_rumble!"
          print(f"VERIFIED CLEAN IPA: {ipa} ({ipa.stat().st_size:,} bytes, sha256={hashlib.sha256(ipa.read_bytes()).hexdigest()})")
          EOF

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garden-Launcher-1.0.2-iOS26-27-MobileUX
          path: Garden-Launcher-1.0.2-iOS26-27-MobileUX.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Garden-Launcher-1.0.2-iOS26-27-MobileUX.ipa
          tag_name: v1.0.2-mobileux
          name: Garden Launcher v1.0.2 Mobile UX + Controller Rumble (iOS / iPadOS 26–27+)
          body: |
            Bản nâng cấp toàn diện trên nền gốc mới nhất [`hanprm9-dot/Garden-Launcher-iOS@v1.0.2`](https://github.com/hanprm9-dot/Garden-Launcher-iOS/releases/tag/v1.0.2) (iOS / iPadOS 26–27+, biên dịch lại `SDVModGarden.framework` + `SDVMobileControls.dll` và ký kiểm định bằng Apple Xcode `codesign --verify --deep --strict`).

            ### Các tính năng & bản sửa lỗi mới trên v1.0.2
            1. **Nút Bỏ Qua Cutscene (`SKIP`) luôn hiển thị rõ & chống cắt viền bo tròn iPhone**:
               - Đưa nút `SKIP` vào vùng an toàn sâu khỏi bo góc màn hình / Dynamic Island / Tai thỏ và không bị che bởi hộp thoại.
               - Luôn hiển thị nút `SKIP` ngay cả khi đang dùng **tay cầm rời** (nơi game gốc ẩn nút Skip vì `SnappyMenus`) và ngay cả khi nhân vật đang hiện hộp thoại (`DialogueBox`) trong cutscene; bấm cảm ứng 1 chạm hoặc bấm nút `Back`/`View` trên tay cầm đều bỏ qua mượt mà.
            2. **Tương tác bảng Lịch & Nhiệm vụ người dân của mod UI Info Suite 2 trong Inventory (cả Cảm ứng & Tay cầm)**:
               - **Bản Cảm ứng**: Chạm trực tiếp vào biểu tượng Lịch / Bảng Nhiệm vụ người dân của UI Info Suite 2 (hoặc nút mod khác trên `InventoryPage` / bên hông `GameMenu`) sẽ gửi tín hiệu chuột trái SMAPI chuẩn (`SButton.MouseLeft`) để mở bảng ngay chỉ với 1 chạm mà không ảnh hưởng kéo thả vật phẩm.
               - **Bản Tay cầm**: Đẩy **Joystick phải (R-Stick)** ngay trong Inventory để di chuyển con trỏ mượt mà tới biểu tượng của UI Info Suite 2 rồi nhấn **`A`** (hoặc **`R3`**) để mở bảng Lịch / Nhiệm vụ; đẩy Joystick trái hoặc D-Pad sẽ lập tức quay lại điều khiển ô đồ chuẩn console.
            3. **Sửa lỗi mod Seasonal Anime Portrait chỉ load 1 số nhân vật**:
               - Ngừng việc `MapRamOptimizer` tự ý đẩy `Portraits/*` ra khỏi bộ nhớ đệm và gọi `Dispose()` lên texture của gói Content Patcher chân dung/nhân vật.
               - Thêm cơ chế đồng bộ chân dung Zero-Harmony (`PortraitSync`) khi `SaveLoaded`, `DayStarted`, hoặc khi Content Patcher cập nhật `Portraits/*` / `Data/Characters`: tự làm mới cache và gọi `NPC.ChooseAppearance()` trực tiếp cho mọi nhân vật (kể cả trong nhà/chuồng/sự kiện), vượt qua lỗi `Texture2D.CopyFromTexture` (`glReadPixels`) trên OpenGL ES iOS vốn bỏ sót các nhân vật đã nạp sớm.
            4. **Chế độ Rung tay cầm (CoreHaptics / `GCController.haptics`) bám sát 100% `StardewValley.Rumble` chuẩn Console / Nintendo Switch**:
               - Biên dịch nhân native CoreHaptics 2 mô-tơ (`LeftHandle` trầm mạnh / `RightHandle` sắc nét, tự fallback 1 mô-tơ cho Switch/MFi) trong `SDVModGarden.framework` (`sdv_ext_set_rumble`).
               - Tự động kích hoạt đủ toàn bộ sự kiện rung chuẩn của `StardewValley.Rumble`: Nổ bom (mạnh nhất 1.0 + giảm dần), cá cắn câu (0.75–0.95), quăng cần (0.50), kéo thanh câu trúng cá (0.10 liên tục), đỡ đòn / nhận sát thương / ngất (0.75), đánh quái (0.10–0.225), cuốc/rìu/cúp (0.10–0.35), tiếng vó ngựa trên đất vs đá/gỗ (0.30 vs 0.10), mở cửa/chuyển cảnh (0.10–0.15) — tự tôn trọng mục **Rumble (Rung)** trong Cài đặt game và tự ngắt tức thì khi tạm dừng / ngắt tay cầm / chuyển sang cảm ứng.
